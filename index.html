<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="style.css" />
		<link
			href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
			rel="stylesheet"
		/>
	</head>
	<body>
		<header class="productivity-nav-bar">
			<h2 class="nav" id="name-of-dashboard">Productivity Dashboard</h2>
			<h2 id="small-name">Dashboard</h2>
			<button class="nav" id="theme-button">CHANGE THEME</button>
		</header>
		<main>
			<!-- //wallpaper -->
			<div id="wallpaper"></div>
			<div id="taskBlock">
				<div id="0" class="box">
					<h4 class="Card-names">To Do List</h4>
				</div>
				<div id="1" class="box">
					<h4 class="Card-names">Daily Planner</h4>
				</div>

				<div id="2" class="box">
					<h4 class="Card-names">Motivation</h4>
				</div>
				<div id="3" class="box">
					<h4 class="Card-names">timer</h4>
				</div>
				<div id="4" class="box">
					<h4 class="Card-names">daily goals</h4>
				</div>
			</div>
		</main>
		<i class="ri-close-line backbutton"></i>
		<div class="todolist newTab">
			<div class="toDoPage">
				
				<div class="taskForm">
					<form>
						<input type="text" placeholder="Enter the task">
						<textarea name="" id="" placeholder="Write content"></textarea>
						<button class="enterButton">ENTER</button>
					</form>
				</div>
				<div class="taskList">
					
				</div>
			</div>
		</div>
		<div class="DailyPlanner newTab">daily planner</div>
		<div class="Motivation newTab">motivation</div>
		<div class="Pomodorotimer newTab">
			<h2>Study with me</h2>
			<div id="pomodoroTimerMainBody"></div>
		</div>
		<div class="dailygoals newTab">daily goals</div>
		<script src="script.js"></script>
	</body>
</html>
