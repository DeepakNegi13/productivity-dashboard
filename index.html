<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Document</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header class="productivity-nav-bar">
			<h2 class="nav" id="name-of-dashboard">Productivity Dashboard</h2>
			<h2 id="small-name">Dashboard</h2>
			<button class="nav" id="theme-button">CHANGE THEME</button>
		</header>
		<main>
			<div id="wallpaper"></div>
			<div id="taskBlock">
				<div id="todolist" class="box">
					<h4 class="Card-names">To Do List</h4>
				</div>
				<div id="DailyPlanner" class="box">
					<h4 class="Card-names">Daily Planner</h4>
				</div>

				<div id="Motivation" class="box">
					<h4 class="Card-names">Motivation</h4>
				</div>
				<div id="Pomodorotimer" class="box">
					<h4 class="Card-names"> timer</h4>
				</div>
				<div id="dailygoals" class="box">
					<h4 class="Card-names">daily goals</h4>
				</div>
			</div>
		</main>
		<div class="todolist newTab" >
			to do list
		</div>
		<div class="DailyPlanner newTab">
			daily planner
		</div>
		<div class="Motivation newTab">
			motivation
		</div>
		<div class="Pomodorotimer newTab">
			timer
		</div>
		<div class="dailygoals newTab">
			daily goals
		</div>
		<script src="script.js"></script>
	</body>
